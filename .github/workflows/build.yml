name: Build and lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check-version
      # Builds dist/ and runs the build's own checks on src/hook.js and src/ui.js,
      # then Mozilla's add-on linter on the Firefox build, then the unit tests.
      - run: npm run lint
      - run: npm run test:unit
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: dist/*.zip
