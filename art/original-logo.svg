<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- VOD Unmuter logo (original artwork). Used for 48 px and 128 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a970ff"/>
      <stop offset="1" stop-color="#6420d6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#shine)"/>
  <!-- speaker -->
  <path d="M24 50 h14 l20 -17 v54 l-20 -17 h-14 a3 3 0 0 1 -3 -3 v-14 a3 3 0 0 1 3 -3 z"
        fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
  <!-- sound coming back -->
  <path d="M70 47 a18 18 0 0 1 0 26" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <path d="M81 37 a32 32 0 0 1 0 46" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".9"/>
  <!-- restored badge -->
  <circle cx="96" cy="96" r="21" fill="#22c55e" stroke="#5b1fc4" stroke-width="5"/>
  <path d="M86.5 96.5 l6.5 6.5 l13 -14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
