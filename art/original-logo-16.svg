<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="geometricPrecision">
  <!-- VOD Unmuter logo for 16 px (original artwork): drawn on the pixel grid,
       the green outer wave stands in for the "restored" badge. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a970ff"/>
      <stop offset="1" stop-color="#6420d6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <path d="M2 6 h2.5 l3.5 -3 v10 l-3.5 -3 h-2.5 z" fill="#fff"/>
  <path d="M9.6 5.9 a3 3 0 0 1 0 4.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M11.6 3.9 a5.8 5.8 0 0 1 0 8.2" fill="none" stroke="#4ade80" stroke-width="1.6" stroke-linecap="round"/>
</svg>
