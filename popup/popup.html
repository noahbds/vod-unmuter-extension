<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Twitch VOD Unmuter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" alt="" width="28" height="28">
    <h1>VOD Unmuter</h1>
  </header>

  <h2>Unmuting</h2>

  <label class="row">
    <span>
      <strong>Restore muted audio</strong>
      <small>Use Twitch's original audio when it still exists</small>
    </span>
    <input type="checkbox" id="enabled" data-reload>
  </label>

  <label class="row">
    <span>
      <strong>Counter in the player</strong>
      <small>Next to the settings button: how many muted parts were unmuted</small>
    </span>
    <input type="checkbox" id="badge">
  </label>

  <label class="row">
    <span>
      <strong>Green seek bar</strong>
      <small>Unmuted parts in green, details on hover</small>
    </span>
    <input type="checkbox" id="recolor">
  </label>

  <h2>Save audio for later</h2>

  <label class="row">
    <span>
      <strong>Save audio for later</strong>
      <small>Twitch deletes the originals about a day after a stream. Keep their sound on this computer so the VOD stays unmuted.</small>
    </span>
    <input type="checkbox" id="saveAudio">
  </label>

  <div class="row sub" data-needs="saveAudio">
    <label for="saveMode">
      <strong>What to save</strong>
      <small id="saveModeHelp"></small>
    </label>
    <select id="saveMode">
      <option value="whole">Whole VOD</option>
      <option value="watched">Parts I play</option>
    </select>
  </div>

  <div class="row sub" data-needs="saveAudio">
    <label for="saveQuality">
      <strong>Saved quality</strong>
      <small id="saveQualityHelp"></small>
    </label>
    <select id="saveQuality">
      <option value="original">Original</option>
      <option value="high">High</option>
      <option value="small">Small</option>
    </select>
  </div>

  <div class="row sub" data-needs="saveAudio">
    <label for="maxStorageMB">
      <strong>Storage limit</strong>
      <small>When full, the oldest saved VODs are deleted first</small>
    </label>
    <select id="maxStorageMB">
      <option value="250">250 MB</option>
      <option value="500">500 MB</option>
      <option value="1000">1 GB</option>
      <option value="2000">2 GB</option>
      <option value="5000">5 GB</option>
      <option value="0">No limit</option>
    </select>
  </div>

  <div class="row sub" data-needs="saveAudio">
    <label for="keepDays">
      <strong>Delete saved audio after</strong>
      <small>Twitch keeps VODs up to 60 days</small>
    </label>
    <select id="keepDays">
      <option value="7">7 days</option>
      <option value="30">30 days</option>
      <option value="60">60 days</option>
      <option value="180">6 months</option>
      <option value="0">Never</option>
    </select>
  </div>

  <h2 class="split" data-needs="saveAudio">
    <span>Auto-save channels</span>
    <button type="button" id="checkNow">Check now</button>
  </h2>
  <p class="muted small" data-needs="saveAudio">
    New VODs from these channels are saved without playing them, while Twitch
    still has the sound. Checked every 20 minutes.
  </p>
  <form id="addChannel" class="add" data-needs="saveAudio">
    <input id="channelInput" type="text" placeholder="Channel name"
           autocomplete="off" spellcheck="false" aria-label="Channel to auto-save">
    <button type="submit">Add</button>
  </form>
  <p id="channelError" class="error" hidden></p>
  <div id="channels" class="saved" data-needs="saveAudio"></div>
  <label class="row" data-needs="saveAudio">
    <span>
      <strong>Open a Twitch tab if needed</strong>
      <small>When no Twitch tab is open, briefly open one in the background to save</small>
    </span>
    <input type="checkbox" id="autoOpenTab">
  </label>
  <p id="autoNote" class="muted small" hidden></p>

  <h2 class="split">
    <span>Saved audio</span>
    <span class="buttons">
      <button type="button" id="backup" title="Export saved audio to a file, or import a backup">Back up…</button>
      <button type="button" id="deleteAll" class="danger" hidden>Delete all</button>
    </span>
  </h2>
  <div id="saved" class="saved" aria-live="polite">
    <p class="muted">Loading…</p>
  </div>

  <h2 class="split">
    <span>Troubleshooting</span>
    <button type="button" id="copyDiag" title="Copy a report to paste in a GitHub issue">Copy diagnostic report</button>
  </h2>
  <p id="status" class="muted small" aria-live="polite">Status: checking…</p>
  <label class="row">
    <span>
      <strong>Debug logging</strong>
      <small>Every check, splice and save in the console (F12)</small>
    </span>
    <input type="checkbox" id="debug">
  </label>

  <p class="note" id="note" hidden>Reload the VOD for this to take effect.</p>

  <script src="popup.js"></script>
</body>
</html>
